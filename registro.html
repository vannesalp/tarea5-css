<form class="register-form" action="post" enctype="multipart/form-data">
  <p>
  <label for="name">Nombre Completo</label>
  <input type="text" name="name" id="name">
  </p>

<p>
  <label for="birthday">Fecha de nacimiento</label>
  <input type="date" name="birthday" id="birthday">
</p>
      
<p>
  <label for="mail">Email</label>
  <input type="email" name="email" id="email">
</p>

<p>
  <label for="address">Direccion</label>
  <input type="text" name="address" id="address">
</p>

<p>
  <label for="web">Pagina Web</label>
  <input type="text" name="web" id="web">
</p>

<p>
  <label for="photo">Foto</label>
  <input type="file" name="photo" id="photo">
</p>

<div class="register-bottom">
  <div class="register-bio">
    <p><label for="biografia">Biografia</label><br>
    <textarea name="biografia" id="biografia" cols="20" rows="8"></textarea>
    </p>

  <figure class="register-image">
